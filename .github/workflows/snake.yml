name: Generate Snake Animation

on:
  # Schedule: Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
  
  # Run automatically on every push to the main branch
  push:
    branches:
      - main

# Grant write permissions for pushing to the output branch
permissions:
  contents: write

jobs:
  generate:
    name: Generate Snake Contribution Animation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Generates snake animation files in the 'dist' folder
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F7FF&color_dots=#161b22,#003d5c,#007799,#00b4d8,#00f7ff
            dist/github-contribution-grid-snake.gif?color_snake=#00F7FF&color_dots=#161b22,#003d5c,#007799,#00b4d8,#00f7ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push generated animation files to the 'output' branch
      - name: Push Snake Animation to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

